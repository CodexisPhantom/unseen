name: CI

# A change that only touches Markdown runs no job: nothing here checks prose.
on:
  pull_request:
    paths-ignore: ["**.md"]
  push:
    branches: [main]
    paths-ignore: ["**.md"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    # The auth library links OpenSSL 3 and ICU 78 (ADR 0006). Ubuntu 26.04 has
    # both; the runner image does not.
    container: ubuntu:26.04
    # A stuck apt mirror once held this job for 50 minutes.
    timeout-minutes: 20
    env:
      RUST_ICU_MAJOR_VERSION_NUMBER: 78
    steps:
      - name: Install system packages
        # archive.ubuntu.com is slow from GitHub runners (about 100 kB/s with
        # timeouts); the Azure mirror the hosted runners use is fast.
        run: |
          sed -i -e 's|http://archive.ubuntu.com|http://azure.archive.ubuntu.com|g' \
            -e 's|http://security.ubuntu.com|http://azure.archive.ubuntu.com|g' \
            /etc/apt/sources.list.d/ubuntu.sources
          apt-get -o Acquire::Retries=3 update
          apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config libssl-dev libicu-dev
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,just
      # Node first: the container has none, and the pnpm installer needs it.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests with coverage minimums
        run: just coverage
      - name: Generated files are up to date
        run: |
          pnpm --dir web install --frozen-lockfile
          just gen
          git diff --exit-code

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  # File handling must work on Windows (docs/09-filesystem.md).
  windows:
    name: Core tests on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p core

