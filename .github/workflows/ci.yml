name: CI

# A change that only touches Markdown runs no job: nothing here checks prose.
on:
  pull_request:
    paths-ignore: ["**.md"]
  push:
    branches: [main]
    paths-ignore: ["**.md"]

# The jobs only read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    # The auth library links OpenSSL 3 and ICU 78 (ADR 0006). Ubuntu 26.04 has
    # both; the runner image does not.
    container: ubuntu:26.04
    # A stuck apt mirror once held this job for 50 minutes.
    timeout-minutes: 20
    env:
      RUST_ICU_MAJOR_VERSION_NUMBER: 78
    steps:
      - name: Install system packages
        # archive.ubuntu.com is slow from GitHub runners (about 100 kB/s with
        # timeouts); the Azure mirror the hosted runners use is fast.
        run: |
          sed -i -e 's|http://archive.ubuntu.com|http://azure.archive.ubuntu.com|g' \
            -e 's|http://security.ubuntu.com|http://azure.archive.ubuntu.com|g' \
            /etc/apt/sources.list.d/ubuntu.sources
          apt-get -o Acquire::Retries=3 update
          apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            ca-certificates curl git unzip build-essential pkg-config libssl-dev libicu-dev
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: cargo-llvm-cov,just
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests with coverage minimums
        run: just coverage

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run lint
      - run: bun run test
      - run: bun run build

  # File handling must work on Windows (docs/09-filesystem.md).
  windows:
    name: Core tests on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test -p core

