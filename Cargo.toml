[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
# Workspace crates. Allowed directions are in docs/02-architecture.md.
core = { path = "crates/core" }
db = { path = "crates/db" }
arr-compat = { path = "crates/arr-compat" }

async-trait = "0.1"
axum = "0.8"
base64 = "0.23"
better-auth = { version = "=1.0.0-alpha.5", features = ["seaorm2"] }
chacha20poly1305 = "0.11"
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
fancy-regex = "0.20.2"
fs4 = "1"
futures-util = "0.3"
hkdf = "0.12"
rand = "0.8"
regex = "1"
roxmltree = "0.21"
reqwest = { version = "0.12", features = ["socks"] }
rust-embed = { version = "8", features = ["mime-guess"] }
sea-orm = { version = "2.0", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros"] }
sea-orm-migration = { version = "2.0", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2"
utoipa = "6"
utoipa-axum = "0.3"
wiremock = "0.6"

# The auth library is generic over our schema, so its code is compiled into
# `api`. With debug information the rlib passes 4 GB, which the MSVC linker
# cannot read.
[profile.dev.package.api]
debug = false

# Line tables are enough for backtraces. Full debug information made the
# coverage build of the many `api` test binaries fill the CI disk (the linker
# died with a bus error).
[profile.dev]
debug = "line-tables-only"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Handlers return `Result<_, Problem>`, the usual Axum shape; the error is
# only built on the failure path.
result_large_err = "allow"
