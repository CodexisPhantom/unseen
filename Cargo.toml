[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
# Workspace crates. Allowed directions are in docs/02-architecture.md.
core = { path = "crates/core" }
db = { path = "crates/db" }
arr-compat = { path = "crates/arr-compat" }

tracing = "0.1"
tracing-subscriber = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
