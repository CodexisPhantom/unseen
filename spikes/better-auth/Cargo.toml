# Throwaway spike for issue #3 / ADR 0006. Not part of the workspace.
[package]
name = "spike-better-auth"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
better-auth = { version = "=1.0.0-alpha.5", default-features = false, features = ["rustls", "axum", "seaorm2"] }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
